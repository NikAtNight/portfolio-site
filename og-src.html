<!doctype html>
<!-- Source for og.png. Regenerate with:
     chrome --headless --window-size=1200,630 --screenshot=og.png og-src.html
     or: swift scripts/render-og.swift "$PWD/og-src.html" og.png 1200 630 -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0a0e1a;
    background-image:
      radial-gradient(ellipse 70% 45% at 50% -5%, rgba(61,111,184,.16), transparent),
      radial-gradient(ellipse 50% 35% at 90% 105%, rgba(90,60,160,.09), transparent);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .win {
    position: relative;
    width: 980px;
    background: rgba(13, 22, 41, .82);
    border: 2px solid #1e3a66;
    box-shadow: 0 0 60px rgba(77, 163, 255, .18);
  }
  .win::before {
    content: '';
    position: absolute; top: -2px; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, transparent, #00a8ff, transparent);
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 34px;
    border-bottom: 2px solid #1e3a66;
    color: #4da3ff;
    font-size: 24px; letter-spacing: .14em;
  }
  .bar .dot { color: #3d6fb8; }
  .body { display: flex; align-items: center; gap: 46px; padding: 52px 56px; }
  .badge { width: 190px; height: 190px; flex-shrink: 0; }
  .name {
    /* 632px of room: 14 uppercase mono glyphs plus the clan tag only fit
       at this size and tracking. Check the render after any change. */
    font-size: 50px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
    color: #e8f4ff;
    text-shadow: 0 0 24px rgba(77, 163, 255, .6);
    white-space: nowrap;
  }
  .name .clan { color: #d9b45b; text-shadow: 0 0 18px rgba(217, 180, 91, .5); font-size: .72em; margin-right: 10px; text-transform: none; vertical-align: 6px; }
  .class-line { margin-top: 18px; font-size: 23px; color: #c9d6e8; white-space: nowrap; }
  .class-line b { color: #d9b45b; font-weight: 600; }
  .meter {
    position: relative; height: 20px; margin-top: 30px;
    background: rgba(80, 80, 80, .35);
    border: 2px solid #3d6fb8;
  }
  .meter .fill {
    height: 100%; width: 86%;
    background: linear-gradient(90deg, #2b5c9e, #4da3ff);
    box-shadow: inset 0 0 6px rgba(255, 255, 255, .5);
  }
  .meter-label {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-size: 19px; letter-spacing: .08em; text-transform: uppercase;
    color: #6d829e;
  }
  .meter-label .val { color: #4da3ff; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar"><span>⟨ STATUS ⟩</span><span class="dot">PLAYER INFO · NIKHILKAPADIA.PAGES.DEV</span></div>
    <div class="body">
      <img class="badge" src="logo.svg" alt="">
      <div style="min-width: 0; flex: 1;">
        <div class="name"><span class="clan">[NaN]</span> Nikhil Kapadia</div>
        <div class="class-line">Senior Software Engineer · <b>Agent Orchestrator</b></div>
        <div class="meter"><div class="fill"></div></div>
        <div class="meter-label"><span>Exp: agent sessions orchestrated</span><span class="val">2,785 / ∞</span></div>
      </div>
    </div>
  </div>
</body>
</html>
